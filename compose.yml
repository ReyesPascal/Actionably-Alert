services:
  actionably-alert:
    image: ghcr.io/reyespascal/actionably-alert:latest
    container_name: actionably-alert
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - actionably-alert-data:/data
    environment:
      - TZ=America/New_York
      # Optional: set these here instead of in the app's Settings.
      # - REPOS=ReyesPascal/Manifexus-
      # - GITHUB_TOKEN=github_pat_xxx
      # - POLL_SECONDS=15

volumes:
  actionably-alert-data:
